- name: Conditionals in ansible
  hosts: local
  connection: local
  tasks:
  - name: Checking if number is even or not
    vars:
      number: 1
    debug:
      msg: "{{number}} is even"
    when: number%2==0
  
  - name: Checking OS of target server
    debug:
      msg: "This is RedHat server"
    when: ansible_facts['os_family']=="RedHat"