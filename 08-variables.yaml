- name: Ansible Facts Gathering
  hosts: local
  connection: local
  tasks:
  - name: Printing ansible_facts
    debug:
      msg: "Printing ansible facts : {{ansible_facts}}"
  
  - name: Printing OS of localhost
    debug: 
      msg: |
          OS FAMILY : {{ansible_facts['os_family']}}
          |
          IPv4 ADDRESS : {{ansible_facts.default_ipv4.address}}
     