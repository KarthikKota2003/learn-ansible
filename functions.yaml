- name: Functions in Ansible
  hosts: local 
  connection: local
  tasks: 
  - name: splitting words in string
    vars:
      topic: "Linux Shell Ansible"
    debug:
      msg: "{{topic}} and list of splitted topics: {{topic|split()}}"
    
  - name: Joining list
    vars:
      names:
      - kota
      - shanmukha
      - kartheek
    debug:
      msg: "{{names}} and joined names are {{names|join(' ')}}"
  
  - name: Upper case, lower case variables
    vars:
      small_case: "kota"
      upper_case: "KOTA"
    debug:
      msg: "{{small_case}} === {{small_case|upper}} &&& {{upper_case}} === {{upper_case|upper}}"