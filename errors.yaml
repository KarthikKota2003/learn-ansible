- name: Error handling in Ansible
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: Executing commands
    command: id roboshop
    register: user_output
    ignore_errors: true
    
  - name: Printing output
    debug:
      msg: "{{user_output}}"

  - name: creating roboshop user if not exists
    command: useradd roboshop
    when: user_output.rc!=0