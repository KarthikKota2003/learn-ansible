- name: Pulling secrets from AWS Secret Manager
  hosts: local
  connection: local
  tasks:
  - name: Pulling all secrets
    debug:
      msg: "{{ lookup('amazon.aws.aws_secret','roboshop/prod/ansible',region='us-east-1') }}"
  
  - name: Querying secrets
    debug:
      msg: "{{ lookup('amazon.aws.aws_secret','roboshop/prod/ansible',region='us-east-1') | from_json | json_query('ansible_user') }}"