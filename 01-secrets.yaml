- name: Pulling secrets from AWS Secret Manager
  hosts: local
  connection: local
  tasks:
  - name: Pulling all secrets
    debug:
      msg: "{{ lookup('amazon.aws.aws_secret','roboshop/prod/ansible',region='us-east-1') }}"
  
  - name: Querying secrets using json_query
    debug:
      msg: "{{ lookup('amazon.aws.aws_secret','roboshop/prod/ansible',region='us-east-1') | from_json | json_query('ansible_user') }}"
  
  - name: Querying secrets using nested flag
    vars:
      secret_object: "{{ lookup('amazon.aws.aws_secret','roboshop/prod/ansible',region='us-east-1',nested=true) }}"
    debug:
      msg: "ansible_user: {{secret_object.ansible_user}}"